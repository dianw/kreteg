# Native binaries for each OS/CPU. GraalVM cannot cross-compile, so every target builds on its own runner.
# A v* tag publishes a GitHub Release (install.sh downloads from it); a manual run only uploads workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older glibc than ubuntu-24.04, so the binary runs on more distros
          - { asset: kreteg-linux-amd64, runner: ubuntu-22.04 }
          - { asset: kreteg-linux-arm64, runner: ubuntu-22.04-arm }
          - { asset: kreteg-darwin-arm64, runner: macos-15 }
          - { asset: kreteg-darwin-amd64, runner: macos-15-intel }
          - { asset: kreteg-windows-amd64.exe, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Builds the native image and runs the native ITs against it, so a binary that doesn't start fails here
      - run: mvn -B verify -Dnative
      - run: |
          mkdir dist
          cp server/target/*-runner* "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add client files and checksums
        run: |
          cp client/skill/SKILL.md client/kreteg-watch dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}" dist/*
