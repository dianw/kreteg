# --- HTTP ---
# 5784 spells KRTG on a phone keypad; 8080 is usually taken on dev machines
quarkus.http.port=5784
quarkus.http.host=0.0.0.0
# The MCP endpoint requires the CORS filter. With no origins listed, browsers may only call Kreteg from its own
# origin, which keeps web pages from driving the local MCP server. UI dev servers (e.g. Vite on :5173) need any origin.
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/.*/

# --- MCP (Streamable HTTP at /mcp) ---
quarkus.mcp.server.server-info.name=kreteg
quarkus.mcp.server.server-info.version=${quarkus.application.version}

# --- Conversations ---
# Upper bound for a long-polling inbox call (REST ?wait= and the MCP inbox tool)
kreteg.inbox.max-wait-seconds=60

# --- SQLite ---
kreteg.db.path=kreteg.db
%test.kreteg.db.path=target/kreteg-test.db
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${kreteg.db.path}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
# SQLite allows one writer at a time; keep the pool small
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=4
