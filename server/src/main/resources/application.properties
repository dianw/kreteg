# --- HTTP ---
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
# UI dev servers (e.g. Vite on :5173) call the API cross-origin
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/.*/

# --- Agent card ---
kreteg.agent.name=Kreteg Bridge
kreteg.agent.description=A2A bridge agent
kreteg.agent.version=0.1.0
kreteg.agent.url=http://localhost:${quarkus.http.port}

# --- SQLite ---
kreteg.db.path=kreteg.db
%test.kreteg.db.path=target/kreteg-test.db
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${kreteg.db.path}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
# SQLite allows one writer at a time; keep the pool small
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=4

# --- A2A ---
# This SDK jar has no beans.xml, so Quarkus would skip its MicroProfileConfigProvider bean and the SDK would
# ignore every a2a.* property below, silently using its built-in defaults instead.
quarkus.index-dependency.a2a-mp-config.group-id=io.github.a2asdk
quarkus.index-dependency.a2a-mp-config.artifact-id=a2a-java-sdk-microprofile-config
a2a.blocking.agent.timeout.seconds=120

# --- Native image ---
# The A2A SDK loads its defaults and transport providers from the classpath at runtime
quarkus.native.resources.includes=META-INF/a2a-defaults.properties,META-INF/services/io.a2a.server.TransportMetadata
quarkus.native.additional-build-args=--features=io.kreteg.core.nativeimage.A2aNativeFeature
